# Produção na VPS (Hostinger), atrás do Traefik do repo vps_infra.
# O workflow .github/workflows/deploy-hostinger.yml copia este arquivo para
# /srv/app_serverhub/docker-compose.yml e grava a IMAGE_TAG no .env ao lado.
#
# Nenhum serviço publica portas: só o frontend entra na rede "proxy" e o Traefik
# roteia https://hub.serveralosao.cloud para ele. O backend fica só na rede interna.

services:
  backend:
    image: ghcr.io/alexandrelosano/app_serverhub-backend:${IMAGE_TAG:-latest}
    container_name: serverhub-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DB_PATH: /app/data/database.db
      PORT: 3000
    volumes:
      - data:/app/data
    networks:
      - internal

  frontend:
    image: ghcr.io/alexandrelosano/app_serverhub-frontend:${IMAGE_TAG:-latest}
    container_name: serverhub-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - internal
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.serverhub.rule=Host(`hub.serveralosao.cloud`)
      - traefik.http.routers.serverhub.entrypoints=websecure
      # O app não tem login próprio e guarda credenciais: fica atrás da mesma
      # senha do dashboard do Traefik (middleware definido no vps_infra).
      - traefik.http.routers.serverhub.middlewares=dashboard-auth@docker
      - traefik.http.services.serverhub.loadbalancer.server.port=80

volumes:
  # Arquivo database.db do SQLite
  data:

networks:
  internal:
  proxy:
    external: true
