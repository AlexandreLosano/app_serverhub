<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Hub - Central de Serviços</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-date">
                <div id="weekday">...</div>
                <div id="date">...</div>
                <div id="time">...</div>
            </div>
            <div class="header-title">
                <h1>Server Hub - Zorin 🚀</h1>
            </div>
            <div class="header-controls">
                <button id="themeToggle" class="theme-toggle" title="Alternar tema">🌓</button>
                <button id="reorderBtn" class="reorder-btn">Reordenar Links</button>
                <div id="reorderActions" class="reorder-actions hidden">
                    <button id="saveOrderBtn" class="save-order-btn">Salvar Ordem</button>
                    <button id="cancelOrderBtn" class="cancel-order-btn">Cancelar</button>
                </div>
            </div>
        </header>

        <div class="search-filter-container">
            <div class="filter-selects">
                <div class="select-group">
                    <label for="categorySelect">Categoria:</label>
                    <select id="categorySelect">
                        <option value="all">Todos</option>
                        <option value="Server">Server</option>
                        <option value="Note">Note</option>
                        <option value="Externo">Externo</option>
                    </select>
                </div>

                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Buscar serviços...">
                </div>

                <div class="select-group">
                    <label for="tagsSelect">Tags:</label>
                    <select id="tagsSelect" multiple size="1">
                        <option value="all" selected>Todas</option>
                    </select>
                </div>
            </div>
        </div>

        <div id="linksContainer" class="links-grid">
            <!-- Cards serão inseridos aqui dinamicamente -->
        </div>

        <footer>
            <p>Para adicionar novos serviços, edite o arquivo <code>links.json</code></p>
            <p>Desenvolvido por Alexandre Losano | 2025</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
