version: '3.8'

# SQLite roda embutido no backend — sem serviço externo de banco de dados.
# O arquivo database.db fica em ./data/ acessível no host (DB Browser for SQLite).

services:
  backend:
    build: ./backend
    container_name: new-server-hub-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DB_PATH: /app/data/database.db
      PORT: ${PORT:-3000}
    ports:
      - "30000:3000"
    volumes:
      - ./data:/app/data          # arquivo .db persistido e acessível no host
      - ./backend/src:/app/src    # HMR em desenvolvimento
      - ./legacy:/app/legacy      # dados legacy para importação
    networks:
      - server-hub-network

  frontend:
    build: ./frontend
    container_name: new-server-hub-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL}
    ports:
      - "30001:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
    networks:
      - server-hub-network

networks:
  server-hub-network:
    driver: bridge
